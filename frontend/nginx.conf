# JudiFiles — nginx do frontend (template: ${...} vira variável no build).
#
# Caminho do tráfego: caddy -> este nginx -> location /api/ -> api:8000.
# O X-Forwarded-For do Caddy é repassado (IP real do cliente) e o prefixo
# /api/ é preservado no proxy_pass (a API já monta as rotas em /api).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # não expor a versão do nginx em Server:/X-Powered-By:
    # cabeçalho de versão ajuda quem procura CVE conhecida
    server_tokens off;

    # limite de tamanho de upload (configurável; padrão 25m)
    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    # ---------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # timeouts folgados para upload/processamento de PDF grande
        proxy_read_timeout ${API_READ_TIMEOUT};
        proxy_send_timeout ${API_READ_TIMEOUT};
        # streaming de upload/download sem buffer em disco do nginx
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ------------------------------------------------------------ saúde
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------- cache
    # AVISO: no nginx, um location que declara `add_header` próprio NÃO
    # herda os do nível server. Por isso os cabeçalhos de segurança abaixo
    # são repetidos em cada location que tenha add_header — sem isso,
    # index.html (o documento do app) era servido SEM CSP/nosniff/frame-ancestors.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # assets versionados pelo Vite: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # --------------------------------------------- SPA fallback (rota React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------- cabeçalhos de segurança
    # (valem para location / e /api/, que não declaram add_header próprio;
    #  location /index.html e /assets/ repetem a lista abaixo por causa da
    #  regra de herança do nginx)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # HSTS fica no Caddy
}
