server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: tudo que não for arquivo/statico volta para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets precisam de cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    #健康检查
    location /health {
        access_log off;
        return 200 "ok";
    }
}
